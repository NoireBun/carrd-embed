<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>

/* ════════════════════════════════════════════
   CUSTOMIZE COLORS — edit only this section
════════════════════════════════════════════ */
:root {
  --mp-surf:     #261a3e; 
  --mp-panel:    #f0f9e6;
  --mp-accent:   #77f7b2;
  --mp-text:     #f0f4e0;
  --mp-dark:     #2b1842;
  --mp-muted:    #8a7aaa;
  --mp-border:   #77f7b2;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  padding: 0 16px;
}

/* ── Player shell — wide & short ── */
.mp {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  border-radius: 0;
  overflow: hidden;
  border: 1px solid var(--mp-border);
  box-shadow: 0 8px 32px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.18);
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-rows: auto auto;
  background: var(--mp-surf);
}

/* ── Autoplay blocked overlay ── */
.mp-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  background: rgba(38, 26, 62, 0.93);
  border-radius: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.mp-overlay.show { display: flex; }
.mp-overlay p {
  color: var(--mp-text);
  font-size: 13px;
  opacity: .75;
}
.mp-overlay-btn {
  padding: 9px 28px;
  background: var(--mp-accent);
  color: var(--mp-surf);
  border: none;
  border-radius: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: .3px;
  transition: opacity .15s;
}
.mp-overlay-btn:hover { opacity: .82; }

/* ── Song info panel ── */
.mp-info {
  background: var(--mp-panel);
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 8px 16px;
  border-bottom: 1px solid var(--mp-border);
  min-width: 0;
}
.mp-info-text {
  flex: 1;
  min-width: 0;
}
.mp-sc-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #ff5500;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .4px;
  flex-shrink: 0;
  margin-right: 14px;
  opacity: .85;
}
.mp-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--mp-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.mp-artist {
  font-size: 11px;
  color: var(--mp-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mp-live {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--mp-muted);
  flex-shrink: 0;
  margin-left: 14px;
}
.mp-live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mp-muted);
  transition: background .3s;
  flex-shrink: 0;
}
.mp-live-dot.on {
  background: var(--mp-accent);
  animation: mp-pulse 1.6s ease-in-out infinite;
}
@keyframes mp-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .2; }
}

/* ── Controls row ── */
.mp-controls {
  grid-column: 1 / -1;
  grid-row: 2;
  background: var(--mp-surf);
  padding: 10px 18px 12px;
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ── Play/prev/next buttons ── */
.mp-btns {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.mp-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--mp-text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 50%;
  transition: color .18s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.mp-btn:hover { color: var(--mp-accent); }
.mp-btn:active { transform: scale(.88); }
.mp-btn-skip { color: rgba(240,244,224,.45); }
.mp-btn-skip:hover { color: var(--mp-accent); }
.mp-btn-play {
  width: 40px;
  height: 40px;
  border: 2px solid var(--mp-accent) !important;
  color: var(--mp-accent);
  border-radius: 0 !important;
}
.mp-btn-play:hover {
  background: var(--mp-accent);
  color: var(--mp-surf);
}

/* ── Progress ── */
.mp-progress {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mp-prog-track {
  height: 3px;
  background: rgba(255,255,255,.1);
  border-radius: 0;
  overflow: hidden;
  cursor: pointer;
}
.mp-prog-fill {
  height: 100%;
  width: 0%;
  background: var(--mp-accent);
  border-radius: 0;
  transition: width .9s linear;
}
.mp-prog-times {
  display: flex;
  justify-content: space-between;
  font-family: 'Space Mono', monospace;
  font-size: 9.5px;
  color: var(--mp-muted);
}

/* ── Volume ── */
.mp-vol-row {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  width: 148px;
}
.mp-btn-mute {
  color: var(--mp-muted);
  padding: 4px;
  flex-shrink: 0;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  border-radius: 50%;
  transition: color .18s;
  -webkit-tap-highlight-color: transparent;
}
.mp-btn-mute.muted { opacity: .35; }
.mp-btn-mute:hover { color: var(--mp-accent); opacity: 1 !important; }
.mp-vol-track {
  flex: 1;
  height: 4px;
  position: relative;
  border-radius: 0;
  background: rgba(255,255,255,.12);
  cursor: pointer;
}
.mp-vol-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--mp-accent);
  border-radius: 0;
  pointer-events: none;
}
.mp-vol-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--mp-accent);
  pointer-events: none;
  box-shadow: 0 0 6px rgba(92,232,192,.38);
}
.mp-vol-input {
  position: absolute;
  inset: -8px 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
  margin: 0;
  padding: 0;
}
.mp-vol-pct {
  font-family: 'Space Mono', monospace;
  font-size: 9.5px;
  color: var(--mp-muted);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
}

  </style>
</head>
<body>

<!-- Hidden SoundCloud iframe -->
<div aria-hidden="true" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none;">
  <iframe id="sc-iframe" scrolling="no" frameborder="no" allow="autoplay" style="width:1px;height:1px;"></iframe>
</div>

<!-- ─────────────────────────────────────────────
     PLAYER UI
───────────────────────────────────────────── -->
<div class="mp" id="mp">

  <div class="mp-overlay" id="mp-overlay">
    <p>Autoplay blocked by browser</p>
    <button class="mp-overlay-btn" onclick="startPlayback()">▶ Start Playing</button>
  </div>

  <!-- Song info row -->
  <div class="mp-info">
    <div class="mp-sc-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M1.175 12.225c-.017.15.025.3.136.4.11.1.256.15.4.13l.99-.14.163.99c.02.1.097.18.196.195.1.02.197-.04.247-.128l.503-.95.502.95c.05.09.147.148.246.128.1-.016.177-.095.197-.195l.162-.988.99.14c.145.02.29-.03.4-.13.112-.101.154-.253.137-.402L6.1 11.28c0-1.81-1.463-3.28-3.27-3.28C1.024 8 0 9.064 0 10.378c0 .82.409 1.551 1.027 2.003l.148-.156zM22 11.5c0-2.485-2.015-4.5-4.5-4.5a4.48 4.48 0 0 0-1.792.373C15.153 5.782 13.386 4.5 11.5 4.5A6.5 6.5 0 0 0 5.077 10.05c-.276-.064-.563-.098-.86-.098C2.346 9.95.92 11.376.92 13.149c0 1.773 1.426 3.21 3.196 3.21H21.5a.5.5 0 0 0 .5-.5V11.5z"/></svg>
      SC
    </div>
    <div class="mp-info-text">
      <div class="mp-title" id="mp-title">—</div>
      <div class="mp-artist" id="mp-artist">—</div>
    </div>
    <div class="mp-live">
      <span class="mp-live-dot" id="mp-dot"></span>
      <span id="mp-live-text">Loading…</span>
    </div>
  </div>

  <!-- Controls row -->
  <div class="mp-controls">
    <div class="mp-btns">
      <button class="mp-btn mp-btn-skip" onclick="prevTrack()" aria-label="Previous track" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mp-btn mp-btn-play" id="mp-play-btn" onclick="togglePlay()" aria-label="Play or pause" title="Play / Pause">
        <svg id="mp-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mp-btn mp-btn-skip" onclick="nextTrack()" aria-label="Next track" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="mp-progress">
      <div class="mp-prog-track">
        <div class="mp-prog-fill" id="mp-prog-fill"></div>
      </div>
      <div class="mp-prog-times">
        <span id="mp-time-cur">0:00</span>
        <span id="mp-time-tot">0:00</span>
      </div>
    </div>

    <div class="mp-vol-row">
      <button class="mp-btn-mute" id="mp-mute-btn" onclick="toggleMute()" aria-label="Mute / unmute" title="Mute">
        <svg id="mp-vol-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <div class="mp-vol-track">
        <div class="mp-vol-fill" id="mp-vol-fill"></div>
        <div class="mp-vol-thumb" id="mp-vol-thumb"></div>
        <input type="range" class="mp-vol-input" id="mp-vol-slider" min="0" max="100" value="50"
               oninput="onVolInput(this.value)" aria-label="Volume">
      </div>
      <span class="mp-vol-pct" id="mp-vol-pct">50%</span>
    </div>
  </div>

</div>

<script>

/* ════════════════════════════════════════════
   ╔══════════════════════════════════════════╗
   ║             CONFIGURATION               ║
   ╠══════════════════════════════════════════╣
   ║                                         ║
   ║  soundcloudUrl  Full SC playlist URL    ║
   ║                                         ║
   ║  defaultVolume  0–100  (default 50)     ║
   ║                 Saved after first visit ║
   ╚══════════════════════════════════════════╝
════════════════════════════════════════════ */
const CONFIG = {
  soundcloudUrl: 'https://soundcloud.com/user-167974902/sets/ena-playlist?si=3f3d839996294f3ba61f344bdff139b0&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing',
  defaultVolume: 50,
};
/* ════════════════════════════════════════════
   End of config
════════════════════════════════════════════ */

let scWidget = null;
let isPlaying = false;
let isMuted   = false;
let volume;

/* Load saved state */
try {
  const sv = localStorage.getItem('mp_volume');
  volume = sv !== null ? parseInt(sv, 10) : CONFIG.defaultVolume;
  const sm = localStorage.getItem('mp_muted');
  isMuted = sm === 'true';
} catch(_) {
  volume = CONFIG.defaultVolume;
}

/* ── Helpers ── */
const $ = id => document.getElementById(id);

function fmt(s) {
  if (!s || isNaN(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function setPlaying(state) {
  isPlaying = state;
  $('mp-play-icon').innerHTML = state
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  const dot = $('mp-dot');
  dot.classList.toggle('on', state);
  $('mp-live-text').textContent = state ? 'Playing' : 'Paused';
}

function setSong(title, artist) {
  $('mp-title').textContent  = title  || '—';
  $('mp-artist').textContent = artist || '—';
}

function setVolUI(v) {
  const pct = Math.round(v);
  $('mp-vol-slider').value = pct;
  $('mp-vol-fill').style.width  = pct + '%';
  $('mp-vol-thumb').style.left  = pct + '%';
  $('mp-vol-pct').textContent   = pct + '%';
  setVolIcon(isMuted ? 0 : v);
}

function setVolIcon(v) {
  const el = $('mp-vol-icon');
  if (!el) return;
  if (v === 0) {
    el.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';
  } else if (v < 40) {
    el.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
  } else {
    el.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
}

function showOverlay(show) {
  $('mp-overlay').classList.toggle('show', show);
}

/* ══════════════════════════════════════════
   SOUNDCLOUD INIT
══════════════════════════════════════════ */
function initSoundCloud() {
  const iframe = $('sc-iframe');
  iframe.src = 'https://w.soundcloud.com/player/?url=' +
    encodeURIComponent(CONFIG.soundcloudUrl) +
    '&auto_play=false&buying=false&liking=false&download=false' +
    '&sharing=false&show_artwork=false&show_comments=false' +
    '&show_playcount=false&show_user=false&hide_related=true';

  const s = document.createElement('script');
  s.src = 'https://w.soundcloud.com/player/api.js';
  s.onload = () => {
    scWidget = SC.Widget(iframe);
    scWidget.bind(SC.Widget.Events.READY, () => {
      /* Restore saved volume & mute — don't autoplay, wait for user */
      const effectiveVol = isMuted ? 0 : volume;
      scWidget.setVolume(effectiveVol);
      setVolUI(volume);
      if (isMuted) {
        $('mp-mute-btn').classList.add('muted');
        setVolIcon(0);
      }
      $('mp-live-text').textContent = 'Ready';
    });

    scWidget.bind(SC.Widget.Events.PLAY, () => {
      setPlaying(true);
      showOverlay(false);
      scWidget.getCurrentSound(s => {
        if (s) setSong(s.title, s.user && s.user.username);
      });
    });

    scWidget.bind(SC.Widget.Events.PAUSE,  () => setPlaying(false));
    scWidget.bind(SC.Widget.Events.FINISH, () => setPlaying(false));

    scWidget.bind(SC.Widget.Events.PLAY_PROGRESS, d => {
      const pos = d.currentPosition, dur = d.duration;
      if (dur > 0) {
        $('mp-prog-fill').style.width = (pos / dur * 100) + '%';
        $('mp-time-cur').textContent  = fmt(pos / 1000);
        $('mp-time-tot').textContent  = fmt(dur / 1000);
      }
    });

    scWidget.bind(SC.Widget.Events.ERROR, () => {
      setSong('Could not load playlist', 'Check soundcloudUrl in CONFIG');
      $('mp-live-text').textContent = 'Error';
    });
  };
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════ */
function togglePlay() {
  if (!scWidget) return;
  scWidget.toggle();
}

function nextTrack() {
  if (scWidget) scWidget.next();
}

function prevTrack() {
  if (scWidget) scWidget.prev();
}

function onVolInput(val) {
  volume = parseInt(val, 10);
  if (isMuted && volume > 0) {
    isMuted = false;
    $('mp-mute-btn').classList.remove('muted');
    try { localStorage.setItem('mp_muted', 'false'); } catch(_) {}
  }
  if (scWidget) scWidget.setVolume(volume);
  setVolUI(volume);
  try { localStorage.setItem('mp_volume', volume); } catch(_) {}
}

function toggleMute() {
  isMuted = !isMuted;
  $('mp-mute-btn').classList.toggle('muted', isMuted);
  if (scWidget) scWidget.setVolume(isMuted ? 0 : volume);
  setVolIcon(isMuted ? 0 : volume);
  try { localStorage.setItem('mp_muted', isMuted); } catch(_) {}
}

function startPlayback() {
  showOverlay(false);
  if (scWidget) scWidget.play();
}

/* ── Boot ── */
setVolUI(volume);
initSoundCloud();

</script>
</body>
</html>
