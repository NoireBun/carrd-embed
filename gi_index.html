<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>

/* ════════════════════════════════════════════
   CUSTOMIZE COLORS — edit only this section
════════════════════════════════════════════ */
:root {
  --mp-bg:       #3a2955;   /* navbar / outer bg          */
  --mp-surf:     #261a3e;   /* controls panel             */
  --mp-panel:    #f0f4e0;   /* song info area (light)     */
  --mp-accent:   #5ce8c0;   /* teal highlight color       */
  --mp-text:     #f0f4e0;   /* text on dark backgrounds   */
  --mp-dark:     #2b1842;   /* text on the light panel    */
  --mp-muted:    #8a7aaa;   /* muted / secondary text     */
  --mp-border:   rgba(92, 232, 192, 0.13);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--mp-bg);
  font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
}

/* ── Player shell ── */
.mp {
  width: 360px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--mp-border);
  box-shadow: 0 0 0 1px rgba(92,232,192,.05),
              0 24px 64px rgba(0,0,0,.5),
              0 8px 24px rgba(0,0,0,.35);
  position: relative;
}

/* ── Autoplay blocked overlay ── */
.mp-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  background: rgba(38, 26, 62, 0.93);
  border-radius: 14px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.mp-overlay.show { display: flex; }
.mp-overlay p {
  color: var(--mp-text);
  font-size: 13px;
  opacity: .75;
}
.mp-overlay-btn {
  padding: 9px 28px;
  background: var(--mp-accent);
  color: var(--mp-surf);
  border: none;
  border-radius: 20px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: .3px;
  transition: opacity .15s;
}
.mp-overlay-btn:hover { opacity: .82; }

/* ── Top bar ── */
.mp-top {
  background: var(--mp-bg);
  padding: 11px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--mp-border);
}
.mp-source {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--mp-accent);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: .3px;
}
.mp-live {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  color: var(--mp-muted);
}
.mp-live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mp-muted);
  transition: background .3s;
}
.mp-live-dot.on {
  background: var(--mp-accent);
  animation: mp-pulse 1.6s ease-in-out infinite;
}
@keyframes mp-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .2; }
}

/* ── Song info panel ── */
.mp-info {
  background: var(--mp-panel);
}
.mp-sparkle {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  letter-spacing: 5.5px;
  color: rgba(92, 232, 192, 0.28);
  padding: 6px 14px 2px;
  white-space: nowrap;
  overflow: hidden;
  user-select: none;
}
.mp-sparkle.bottom { padding: 2px 14px 6px; }
.mp-title {
  padding: 3px 16px 1px;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--mp-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.mp-artist {
  padding: 1px 16px 3px;
  font-size: 11.5px;
  color: var(--mp-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Progress ── */
.mp-progress {
  background: var(--mp-surf);
  padding: 10px 18px 8px;
  border-top: 1px solid var(--mp-border);
}
.mp-prog-track {
  height: 3px;
  background: rgba(255,255,255,.1);
  border-radius: 2px;
  overflow: hidden;
}
.mp-prog-fill {
  height: 100%;
  width: 0%;
  background: var(--mp-accent);
  border-radius: 2px;
  transition: width .9s linear;
}
.mp-prog-times {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  color: var(--mp-muted);
}

/* ── Controls panel ── */
.mp-controls {
  background: var(--mp-surf);
  padding: 12px 18px 16px;
}
.mp-btns {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 14px;
}
.mp-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--mp-text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px;
  border-radius: 50%;
  transition: color .18s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.mp-btn:hover { color: var(--mp-accent); }
.mp-btn:active { transform: scale(.88); }
.mp-btn-skip { color: rgba(240,244,224,.5); }
.mp-btn-skip:hover { color: var(--mp-accent); }
.mp-btn-play {
  width: 50px;
  height: 50px;
  border: 2px solid var(--mp-accent) !important;
  color: var(--mp-accent);
}
.mp-btn-play:hover {
  background: var(--mp-accent);
  color: var(--mp-surf);
}
.mp-btn-mute {
  color: var(--mp-muted);
  padding: 5px;
  flex-shrink: 0;
}
.mp-btn-mute.muted { opacity: .35; }
.mp-btn-mute:hover { color: var(--mp-accent); opacity: 1 !important; }

/* ── Volume ── */
.mp-vol-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.mp-vol-track {
  flex: 1;
  height: 4px;
  position: relative;
  border-radius: 2px;
  background: rgba(255,255,255,.12);
  cursor: pointer;
}
.mp-vol-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 50%;
  background: var(--mp-accent);
  border-radius: 2px;
  pointer-events: none;
}
.mp-vol-thumb {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--mp-accent);
  pointer-events: none;
  box-shadow: 0 0 7px rgba(92,232,192,.38);
}
.mp-vol-input {
  position: absolute;
  inset: -8px 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
  margin: 0;
  padding: 0;
}
.mp-vol-pct {
  font-family: 'Space Mono', monospace;
  font-size: 10.5px;
  color: var(--mp-muted);
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}

  </style>
</head>
<body>

<!-- ─────────────────────────────────────────────
     HIDDEN PLAYBACK CONTAINERS
───────────────────────────────────────────── -->
<div aria-hidden="true" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none;">
  <div id="yt-player"></div>
  <iframe id="sc-iframe" scrolling="no" frameborder="no" allow="autoplay" style="width:1px;height:1px;"></iframe>
</div>

<!-- ─────────────────────────────────────────────
     PLAYER UI
───────────────────────────────────────────── -->
<div class="mp" id="mp">

  <div class="mp-overlay" id="mp-overlay">
    <p>Autoplay blocked by browser</p>
    <button class="mp-overlay-btn" onclick="startPlayback()">▶ Start Playing</button>
  </div>

  <!-- Top bar -->
  <div class="mp-top">
    <div class="mp-source" id="mp-source">
      <svg id="mp-src-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"></svg>
      <span id="mp-src-label"></span>
    </div>
    <div class="mp-live">
      <span class="mp-live-dot" id="mp-dot"></span>
      <span id="mp-live-text">Idle</span>
    </div>
  </div>

  <!-- Song info -->
  <div class="mp-info">
    <div class="mp-sparkle">+ · ✦ ★ + · ✦ · ★ ✧ + ✦ + · ✧ · ★ ✦ + · ✧ ★ + · ✦</div>
    <div class="mp-title" id="mp-title">—</div>
    <div class="mp-artist" id="mp-artist">—</div>
    <div class="mp-sparkle bottom">★ ✧ · + ✦ · ★ + · ✦ ★ ✧ + · ✦ · ★ + · ✧ ✦ ★ + ·</div>
  </div>

  <!-- Progress -->
  <div class="mp-progress">
    <div class="mp-prog-track">
      <div class="mp-prog-fill" id="mp-prog-fill"></div>
    </div>
    <div class="mp-prog-times">
      <span id="mp-time-cur">0:00</span>
      <span id="mp-time-tot">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="mp-controls">
    <div class="mp-btns">
      <button class="mp-btn mp-btn-skip" onclick="prevTrack()" aria-label="Previous track" title="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mp-btn mp-btn-play" id="mp-play-btn" onclick="togglePlay()" aria-label="Play or pause" title="Play / Pause">
        <svg id="mp-play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mp-btn mp-btn-skip" onclick="nextTrack()" aria-label="Next track" title="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="mp-vol-row">
      <button class="mp-btn mp-btn-mute" id="mp-mute-btn" onclick="toggleMute()" aria-label="Mute / unmute" title="Mute">
        <svg id="mp-vol-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <div class="mp-vol-track">
        <div class="mp-vol-fill" id="mp-vol-fill"></div>
        <div class="mp-vol-thumb" id="mp-vol-thumb"></div>
        <input type="range" class="mp-vol-input" id="mp-vol-slider" min="0" max="100" value="50"
               oninput="onVolInput(this.value)" aria-label="Volume">
      </div>
      <span class="mp-vol-pct" id="mp-vol-pct">50%</span>
    </div>
  </div>

</div><!-- /.mp -->

<script>

/* ════════════════════════════════════════════
   ╔══════════════════════════════════════════╗
   ║             CONFIGURATION               ║
   ╠══════════════════════════════════════════╣
   ║                                         ║
   ║  source         'youtube' | 'soundcloud'║
   ║                                         ║
   ║  youtubeId      From the playlist URL:  ║
   ║                 ?list=<PASTE HERE>      ║
   ║                                         ║
   ║  soundcloudUrl  Full SC playlist URL    ║
   ║                                         ║
   ║  defaultVolume  0–100  (default 50)     ║
   ║                 Saved after first change║
   ║                                         ║
   ║  colors         Hex codes for the UI   ║
   ╚══════════════════════════════════════════╝
════════════════════════════════════════════ */
const CONFIG = {

  source: 'youtube',

  youtubeId: 'https://youtube.com/playlist?list=PLSUXUNuJAIQHt9qnFsb9kqKrEAQNcyCE-&si=334XIYjYM4BwL_00',

  soundcloudUrl: 'https://soundcloud.com/user/sets/your-playlist',

  defaultVolume: 50,

  colors: {
    bg:      '#3a2955',
    surf:    '#261a3e',
    panel:   '#f0f4e0',
    accent:  '#5ce8c0',
    text:    '#f0f4e0',
    dark:    '#2b1842',
    muted:   '#8a7aaa',
  }

};
/* ════════════════════════════════════════════
   End of config — no need to edit below here
════════════════════════════════════════════ */

let ytPlayer = null;
let scWidget = null;
let isPlaying = false;
let isMuted   = false;
let volume;
let tickId    = null;

/* Load saved volume, fall back to default */
try {
  const sv = localStorage.getItem('mp_volume');
  volume = sv !== null ? parseInt(sv, 10) : CONFIG.defaultVolume;
} catch(_) {
  volume = CONFIG.defaultVolume;
}

/* Apply CONFIG.colors to CSS variables */
(function applyColors() {
  const c = CONFIG.colors, r = document.documentElement.style;
  r.setProperty('--mp-bg',    c.bg);
  r.setProperty('--mp-surf',  c.surf);
  r.setProperty('--mp-panel', c.panel);
  r.setProperty('--mp-accent',c.accent);
  r.setProperty('--mp-text',  c.text);
  r.setProperty('--mp-dark',  c.dark);
  r.setProperty('--mp-muted', c.muted);
})();

/* Source badge */
(function setupBadge() {
  const lbl = document.getElementById('mp-src-label');
  const ico = document.getElementById('mp-src-icon');
  if (CONFIG.source === 'youtube') {
    lbl.textContent = 'YouTube';
    ico.innerHTML = '<path d="M21.543 6.498C22 8.28 22 12 22 12s0 3.72-.457 5.502c-.254.985-.997 1.76-1.938 2.022C17.896 20 12 20 12 20s-5.893 0-7.605-.476c-.945-.266-1.687-1.04-1.938-2.022C2 15.72 2 12 2 12s0-3.72.457-5.502c.254-.985.997-1.76 1.938-2.022C6.107 4 12 4 12 4s5.896 0 7.605.476c.945.266 1.687 1.04 1.938 2.022zM10 15.5l6-3.5-6-3.5v7z"/>';
  } else {
    lbl.textContent = 'SoundCloud';
    ico.innerHTML = '<path d="M1.175 12.225c-.017.15.025.3.136.4.11.1.256.15.4.13l.99-.14.163.99c.02.1.097.18.196.195.1.02.197-.04.247-.128l.503-.95.502.95c.05.09.147.148.246.128.1-.016.177-.095.197-.195l.162-.988.99.14c.145.02.29-.03.4-.13.112-.101.154-.253.137-.402L6.1 11.28c0-1.81-1.463-3.28-3.27-3.28C1.024 8 0 9.064 0 10.378c0 .82.409 1.551 1.027 2.003l.148-.156zM22 11.5c0-2.485-2.015-4.5-4.5-4.5a4.48 4.48 0 0 0-1.792.373C15.153 5.782 13.386 4.5 11.5 4.5A6.5 6.5 0 0 0 5.077 10.05c-.276-.064-.563-.098-.86-.098C2.346 9.95.92 11.376.92 13.149c0 1.773 1.426 3.21 3.196 3.21H21.5a.5.5 0 0 0 .5-.5V11.5z"/>';
  }
})();

/* ── Helpers ── */
const $ = id => document.getElementById(id);

function fmt(s) {
  if (!s || isNaN(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function setPlaying(state) {
  isPlaying = state;
  $('mp-play-icon').innerHTML = state
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  const dot = $('mp-dot');
  dot.classList.toggle('on', state);
  $('mp-live-text').textContent = state ? 'Playing' : 'Paused';
}

function setSong(title, artist) {
  $('mp-title').textContent  = title  || '—';
  $('mp-artist').textContent = artist || '—';
}

function setVolUI(v) {
  const pct = Math.round(v);
  $('mp-vol-slider').value = pct;
  $('mp-vol-fill').style.width  = pct + '%';
  $('mp-vol-thumb').style.left  = pct + '%';
  $('mp-vol-pct').textContent   = pct + '%';
  setVolIcon(isMuted ? 0 : v);
}

function setVolIcon(v) {
  const el = $('mp-vol-icon');
  if (!el) return;
  if (v === 0) {
    el.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';
  } else if (v < 40) {
    el.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
  } else {
    el.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
}

function showOverlay(show) {
  $('mp-overlay').classList.toggle('show', show);
}

function startTick() {
  clearInterval(tickId);
  tickId = setInterval(() => {
    if (!ytPlayer) return;
    try {
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      if (dur > 0) {
        $('mp-prog-fill').style.width = (cur / dur * 100) + '%';
        $('mp-time-cur').textContent = fmt(cur);
        $('mp-time-tot').textContent = fmt(dur);
      }
    } catch(_) {}
  }, 1000);
}

/* ══════════════════════════════════════════
   YOUTUBE
══════════════════════════════════════════ */
function initYouTube() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '1', width: '1',
    playerVars: {
      listType:        'playlist',
      list:            CONFIG.youtubeId,
      autoplay:        1,
      controls:        0,
      fs:              0,
      iv_load_policy:  3,
      rel:             0,
      origin:          location.origin
    },
    events: {
      onReady(e) {
        e.target.setVolume(volume);
        setVolUI(volume);
        try { e.target.playVideo(); } catch(_) { showOverlay(true); }
      },
      onStateChange(e) {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) {
          setPlaying(true);
          showOverlay(false);
          startTick();
          setTimeout(() => {
            const d = ytPlayer.getVideoData();
            if (d) setSong(d.title, d.author);
          }, 500);
        } else if (e.data === S.PAUSED || e.data === S.ENDED) {
          setPlaying(false);
          clearInterval(tickId);
        }
      },
      onError() {
        setSong('Could not load playlist', 'Check youtubeId in CONFIG');
      }
    }
  });
};

/* ══════════════════════════════════════════
   SOUNDCLOUD
══════════════════════════════════════════ */
function initSoundCloud() {
  const iframe = $('sc-iframe');
  iframe.src = 'https://w.soundcloud.com/player/?url=' +
    encodeURIComponent(CONFIG.soundcloudUrl) +
    '&auto_play=true&buying=false&liking=false&download=false' +
    '&sharing=false&show_artwork=false&show_comments=false' +
    '&show_playcount=false&show_user=false&hide_related=true';

  const s = document.createElement('script');
  s.src = 'https://w.soundcloud.com/player/api.js';
  s.onload = () => {
    scWidget = SC.Widget(iframe);
    scWidget.bind(SC.Widget.Events.READY, () => {
      scWidget.setVolume(volume);
      setVolUI(volume);
      try { scWidget.play(); } catch(_) { showOverlay(true); }
    });
    scWidget.bind(SC.Widget.Events.PLAY, () => {
      setPlaying(true); showOverlay(false);
      scWidget.getCurrentSound(s => { if (s) setSong(s.title, s.user && s.user.username); });
    });
    scWidget.bind(SC.Widget.Events.PAUSE,  () => setPlaying(false));
    scWidget.bind(SC.Widget.Events.FINISH, () => setPlaying(false));
    scWidget.bind(SC.Widget.Events.PLAY_PROGRESS, d => {
      const pos = d.currentPosition, dur = d.duration;
      if (dur > 0) {
        $('mp-prog-fill').style.width = (pos / dur * 100) + '%';
        $('mp-time-cur').textContent = fmt(pos / 1000);
        $('mp-time-tot').textContent = fmt(dur / 1000);
      }
    });
  };
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════ */
function togglePlay() {
  if (CONFIG.source === 'youtube' && ytPlayer) {
    isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
  } else if (CONFIG.source === 'soundcloud' && scWidget) {
    scWidget.toggle();
  }
}

function nextTrack() {
  if (CONFIG.source === 'youtube' && ytPlayer) ytPlayer.nextVideo();
  else if (CONFIG.source === 'soundcloud' && scWidget) scWidget.next();
}

function prevTrack() {
  if (CONFIG.source === 'youtube' && ytPlayer) ytPlayer.previousVideo();
  else if (CONFIG.source === 'soundcloud' && scWidget) scWidget.prev();
}

function onVolInput(val) {
  volume = parseInt(val, 10);
  if (isMuted && volume > 0) {
    isMuted = false;
    $('mp-mute-btn').classList.remove('muted');
  }
  if (CONFIG.source === 'youtube' && ytPlayer) {
    ytPlayer.unMute();
    ytPlayer.setVolume(volume);
  } else if (CONFIG.source === 'soundcloud' && scWidget) {
    scWidget.setVolume(volume);
  }
  setVolUI(volume);
  try { localStorage.setItem('mp_volume', volume); } catch(_) {}
}

function toggleMute() {
  isMuted = !isMuted;
  $('mp-mute-btn').classList.toggle('muted', isMuted);
  if (CONFIG.source === 'youtube' && ytPlayer) {
    isMuted ? ytPlayer.mute() : ytPlayer.unMute();
  } else if (CONFIG.source === 'soundcloud' && scWidget) {
    scWidget.setVolume(isMuted ? 0 : volume);
  }
  setVolIcon(isMuted ? 0 : volume);
}

function startPlayback() {
  showOverlay(false);
  if (CONFIG.source === 'youtube' && ytPlayer) ytPlayer.playVideo();
  else if (CONFIG.source === 'soundcloud' && scWidget) scWidget.play();
}

/* ── Init ── */
setVolUI(volume);
if (CONFIG.source === 'youtube')      initYouTube();
else if (CONFIG.source === 'soundcloud') initSoundCloud();

</script>
</body>
</html>
