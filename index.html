<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw me something</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bw: 4px;
    --btn: 42px;
    --blue: #9db0ff;
    --red: #ff2a2a;
    --gray: #c9c7c7;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: "Nunito", ui-rounded, "Varela Round", system-ui, sans-serif;
    font-weight: 800;
    color: #000;
    padding: 18px 18px 16px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, .thumb:focus-visible, textarea:focus-visible, .sv:focus-visible, .hue:focus-visible, .picker input:focus-visible {
    outline: 3px solid #ff4fa0; outline-offset: 2px;
  }

  .app { position: relative; max-width: 780px; margin: 0 auto; display: grid; gap: 16px; }

  .stage {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) 48px;
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: #fff; border: var(--bw) solid #000; padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .tools { display: grid; grid-template-columns: repeat(2, var(--btn)); gap: 6px; }
  .tbtn {
    width: var(--btn); height: var(--btn); padding: 0;
    border: var(--bw) solid #000; background: #fff;
    display: grid; place-items: center;
  }
  .tbtn[aria-pressed="true"] { background: var(--blue); }
  .tbtn svg { width: 24px; height: 24px; }
  .tbtn[data-multi="true"] { position: relative; }
  .tbtn[data-multi="true"]::after {
    content: ""; position: absolute; right: 2px; bottom: 2px; width: 0; height: 0;
    border-style: solid; border-width: 0 0 7px 7px; border-color: transparent transparent #000 transparent;
    pointer-events: none;
  }
  svg .s { fill: none; stroke: #000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .flyout {
    position: absolute; z-index: 25; display: flex; gap: 6px; padding: 6px;
    background: #fff; border: var(--bw) solid #000;
  }

  .layerbox { display: flex; flex-direction: column; gap: 6px; width: calc(var(--btn) * 2 + 6px); }
  .addlayer {
    height: 30px; padding: 0; border: var(--bw) solid #000; background: #fff; font-size: 14px;
  }
  .addlayer:disabled { opacity: 0.35; cursor: default; }
  .layers {
    display: flex; flex-direction: column; width: 100%;
    max-height: calc(34px * 3 - var(--bw) * 2);
    overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
  }
  .lrow { display: flex; flex: none; }
  .lrow + .lrow { margin-top: calc(var(--bw) * -1); }
  .eye {
    width: 38px; height: 34px; padding: 0; flex: none;
    border: var(--bw) solid #000; background: #fff;
    display: grid; place-items: center;
  }
  .eye svg { width: 20px; height: 20px; }
  .eye .slash { display: none; }
  .eye[aria-pressed="false"] { background: #e2e0e0; }
  .eye[aria-pressed="false"] .slash { display: block; }
  .lbtn {
    flex: 1; min-width: 0; height: 34px; background: #fff; border: var(--bw) solid #000; padding: 0;
    margin-left: calc(var(--bw) * -1);
    font-size: 18px; line-height: 1;
  }
  .lbtn[aria-pressed="true"] { background: var(--blue); position: relative; }
  .lbtn[data-movable="true"], .eye[data-movable="true"] { cursor: grab; }
  .lrow.dragging { position: relative; z-index: 2; filter: drop-shadow(3px 3px 0 #000); }
  .lbtn[data-clip="true"]::before { content: "\21B3"; font-size: 13px; margin-right: 2px; }

  .lmenu {
    position: absolute; z-index: 30; width: 236px; padding: 12px;
    background: #fff; border: var(--bw) solid #000; display: grid; gap: 10px; font-size: 0.9rem;
  }
  .lm-title { font-size: 1.05rem; }
  .lm-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; }
  .lm-row input[type="range"] { width: 100%; min-width: 0; accent-color: #000; }
  .lm-row select {
    grid-column: 2 / 4; border: 3px solid #000; background: #fff; font: inherit; font-size: 0.9rem; padding: 4px 6px;
  }
  .lm-check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .lm-check input { width: 18px; height: 18px; accent-color: #000; margin: 0; }
  .lm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lm-btns button { border: 3px solid #000; background: #fff; padding: 6px 8px; font-size: 0.85rem; }
  .lm-btns button:disabled { opacity: 0.35; cursor: default; }
  .lm-btns .wide { grid-column: 1 / -1; }
  #lm-sel { background: var(--blue); }
  #lm-del.armed { background: var(--red); color: #fff; }

  .colors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: calc(var(--btn) * 2 + 6px); }
  .swatch {
    width: 100%; aspect-ratio: 1; padding: 0; border-radius: 50%;
    border: var(--bw) solid #000;
  }
  .swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--ring, #fff); }
  .custom {
    width: 100%; position: relative; height: 38px; margin-top: 4px; padding: 0;
    border: var(--bw) solid #000;
    background: linear-gradient(135deg, #ff2a2a, #ffa500 20%, #ffee00 32%, #31e84a 44%, #00f0ff 58%, #1f3bff 72%, #ff00e6 88%);
  }
  .custom[data-active="true"] { box-shadow: inset 0 0 0 3px var(--ring, #fff); }
  .colors .tbtn { width: 100%; height: 38px; margin-top: 4px; }

  .center { display: grid; gap: 10px; min-width: 0; }
  .actions { display: flex; align-items: center; justify-content: space-between; }
  .hist { display: flex; gap: 8px; }
  .abtn {
    width: var(--btn); height: var(--btn); padding: 0;
    border: var(--bw) solid #000; background: #fff;
    display: grid; place-items: center;
  }
  .abtn svg { width: 24px; height: 24px; }
  .abtn:disabled { opacity: 0.35; cursor: default; }
  #redo svg { transform: scaleX(-1); }
  #clear .s { stroke: var(--red); stroke-width: 3.4; }

  .frame { position: relative; border: var(--bw) solid #000; background: #fff; }
  .paper { position: relative; aspect-ratio: 8 / 5; overflow: hidden; }
  .paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .paper canvas#overlay { pointer-events: auto; touch-action: none; cursor: crosshair; }

  #textedit {
    position: absolute; z-index: 4; min-width: 24px; min-height: 1.2em; margin: 0; padding: 0;
    white-space: pre; outline: 2px dashed #3a56d4; outline-offset: 2px;
    background: rgba(120, 120, 120, 0.12); font-weight: 400; cursor: text;
  }

  .textbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .textbar select, .textbar input {
    border: 3px solid #000; background: #fff; font: inherit; font-size: 0.9rem; padding: 5px 8px; height: 36px;
  }
  .textbar input { width: 70px; }
  .textbar button { border: 3px solid #000; background: #fff; padding: 0 12px; height: 36px; font-size: 0.9rem; }
  .textbar button[aria-pressed="true"] { background: var(--blue); }
  #tx-done { background: var(--blue); }

  .selbar { position: absolute; z-index: 6; display: flex; background: #fff; border: var(--bw) solid #000; }
  .sbtn { width: 38px; height: 38px; padding: 0; border: 0; background: #fff; display: grid; place-items: center; }
  .sbtn + .sbtn { border-left: 3px solid #000; }
  .sbtn[aria-pressed="true"] { background: var(--blue); }
  .sbtn svg { width: 22px; height: 22px; }

  .recent { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; min-height: 34px; flex-wrap: wrap; }
  .recent-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .recent .label { font-size: 0.85rem; color: #555; }
  .recent-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .recent .swatch { width: 28px; height: 28px; aspect-ratio: auto; flex: none; border-width: 3px; }
  .recent .hint { font-size: 0.85rem; color: #aaa; }

  .confirm {
    position: absolute; inset: 0; z-index: 5;
    display: grid; place-items: center; padding: 12px;
    background: rgba(255, 255, 255, 0.6);
  }
  .confirm-card {
    background: #fff; border: var(--bw) solid #000; padding: 16px 18px;
    max-width: 320px; text-align: center; display: grid; gap: 10px;
  }
  .confirm-card p { margin: 0; }
  .confirm-card .big { font-size: 1.15rem; }
  .confirm-card .small { font-size: 0.9rem; color: #444; font-weight: 700; }
  .confirm-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .confirm-row button { border: var(--bw) solid #000; padding: 8px 14px; background: #fff; }
  #confirm-yes { background: var(--red); color: #fff; }
  #confirm-no { background: var(--blue); }

  .picker {
    position: absolute; z-index: 20; width: 224px;
    background: #fff; border: var(--bw) solid #000; padding: 12px;
    display: grid; gap: 12px;
  }
  .sv, .hue {
    position: relative; border: 3px solid #000; touch-action: none; cursor: crosshair; user-select: none;
  }
  .sv {
    height: 150px;
    background-color: #f00;
    background-image: linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, rgba(255,255,255,0));
  }
  .hue {
    height: 22px;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .knob {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #000; pointer-events: none;
  }
  .hue .knob { top: 50%; }
  .prow { display: flex; gap: 8px; align-items: center; }
  .prev { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #000; flex: none; }
  .picker input {
    width: 100%; min-width: 0; border: 3px solid #000; padding: 6px 8px; font: inherit; font-size: 0.95rem; background: #fff;
  }
  .pdone { border: 3px solid #000; background: var(--blue); padding: 6px 12px; flex: none; }

  .sizebar { align-self: stretch; display: flex; justify-content: center; }
  .track {
    position: relative; width: 6px; background: #000; margin: 52px 0 46px; touch-action: none; cursor: pointer;
  }
  .sizebar.dim .track { opacity: 0.45; }
  .thumb {
    position: absolute; left: 50%; width: 44px; height: 44px;
    transform: translate(-50%, -50%);
    border: var(--bw) solid #000; border-radius: 50%; background: #fff;
    display: grid; place-items: center; cursor: grab;
  }
  .ball { display: block; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }
  .ball.eraser { background: transparent !important; box-shadow: none; border: 2px dashed #000; }

  .msgbox { position: relative; background: #fff; border: var(--bw) solid #000; will-change: transform; }
  textarea {
    display: block; width: 100%; height: 124px; resize: none; border: 0; background: transparent;
    padding: 14px 16px 26px; font: inherit; font-size: 1.15rem; color: #000;
  }
  textarea::placeholder { color: var(--gray); opacity: 1; }
  textarea:focus-visible { outline-offset: -6px; }
  .count { position: absolute; right: 12px; bottom: 6px; font-size: 0.8rem; color: #777; pointer-events: none; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .send-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #send {
    background: var(--blue); border: var(--bw) solid #000; padding: 10px 22px; font-size: 1.05rem;
  }
  #send:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 #000; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { background: #fff; border: var(--bw) solid #000; padding: 6px 12px; font-size: 0.95rem; }
  #status:empty { display: none; }
  #status.ok { background: var(--blue); }
  #status.err { background: #ffb8b8; }

  @media (max-width: 540px) {
    body { padding: 12px 10px 12px; }
    .stage { grid-template-columns: minmax(0, 1fr) 40px; gap: 10px; }
    .panel { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .tools { grid-template-columns: repeat(4, var(--btn)); }
    .layerbox { flex-direction: row; width: auto; align-items: center; max-width: 100%; }
    .addlayer { width: 64px; height: 34px; flex: none; }
    .layers { flex-direction: row; width: auto; max-width: 210px; max-height: none; overflow-x: auto; overflow-y: hidden; }
    .lrow + .lrow { margin-top: 0; margin-left: calc(var(--bw) * -1); }
    .lbtn { flex: none; width: 46px; }
    .colors { display: flex; flex-wrap: wrap; justify-content: center; width: auto; max-width: 320px; }
    .custom, .colors .tbtn { width: 46px; height: 34px; margin-top: 0; }
    .swatch { width: 34px; }
    .recent .swatch { width: 28px; }
    .thumb { width: 38px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #send:hover:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="stage">

    <div class="panel" role="toolbar" aria-label="Drawing tools">
      <div class="tools">
        <button class="tbtn" id="t-pencil" aria-pressed="true" aria-label="Pencil" title="Pencil (P)"></button>
        <button class="tbtn" id="t-eraser" aria-pressed="false" aria-label="Eraser" title="Eraser (E)"></button>
        <button class="tbtn" id="t-bucket" aria-pressed="false" aria-label="Paint bucket" title="Paint bucket (B)"></button>
        <button class="tbtn" id="t-lasso" aria-pressed="false" aria-label="Lasso" title="Lasso (L)"></button>
      </div>

      <div class="layerbox">
        <button class="addlayer" id="addlayer" title="Add a layer">+ Layer</button>
        <div class="layers" id="layerlist" role="group" aria-label="Layers"></div>
      </div>

      <div class="colors" id="colors" role="group" aria-label="Colors">
        <button class="custom" id="custom" aria-label="Pick any color" aria-haspopup="dialog" title="Pick any color"></button>
        <button class="tbtn" id="t-picker" aria-pressed="false" aria-label="Eyedropper" title="Eyedropper (I)"></button>
      </div>
    </div>

    <div class="center">
      <div class="actions">
        <div class="hist">
          <button class="abtn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24"><path class="s" d="M9 6L4 11l5 5"/><path class="s" d="M4 11h9.5a6 6 0 0 1 0 12H9"/></svg>
          </button>
          <button class="abtn" id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled>
            <svg viewBox="0 0 24 24"><path class="s" d="M9 6L4 11l5 5"/><path class="s" d="M4 11h9.5a6 6 0 0 1 0 12H9"/></svg>
          </button>
        </div>
        <button class="abtn" id="clear" aria-label="Clear drawing" title="Clear drawing">
          <svg viewBox="0 0 24 24"><path class="s" d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>

      <div class="frame" id="frame">
        <div class="paper">
          <canvas id="view" width="800" height="500"></canvas>
          <canvas id="overlay" width="800" height="500" aria-label="Drawing canvas"></canvas>
          <div id="textedit" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="Text" hidden></div>

          <div class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
            <div class="confirm-card">
              <p class="big" id="confirm-title">Clear the whole drawing?</p>
              <p class="small">All layers will be wiped.</p>
              <div class="confirm-row">
                <button id="confirm-yes">Clear it</button>
                <button id="confirm-no">Keep drawing</button>
              </div>
            </div>
          </div>
        </div>

        <div class="selbar" id="selbar" role="toolbar" aria-label="Selection actions" hidden>
          <button class="sbtn" id="s-fill" aria-label="Fill selection" title="Fill (F)">
            <svg viewBox="0 0 24 24"><path class="s" d="M5 11l7-7 7 7-6.5 6.5a2 2 0 0 1-2.8 0z"/><path class="s" d="M5 11h14"/><path d="M20 14.5c1 1.6 1.6 2.5 1.6 3.3a1.6 1.6 0 0 1-3.2 0c0-.8.6-1.7 1.6-3.3z" fill="#000"/></svg>
          </button>
          <button class="sbtn" id="s-del" aria-label="Delete inside selection" title="Delete (Del / Backspace)">
            <svg viewBox="0 0 24 24"><path class="s" d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l1 12.2h9L17.5 7M10 11v5.5M14 11v5.5"/></svg>
          </button>
          <button class="sbtn" id="s-tf" aria-pressed="false" aria-label="Transform" title="Transform (Scale / Rotate, Enter to finish)">
            <svg viewBox="0 0 24 24"><rect class="s" x="5" y="5" width="14" height="14" stroke-dasharray="3 2.5"/></svg>
          </button>
          <button class="sbtn" id="s-x" aria-label="Deselect" title="Deselect (Esc)">
            <svg viewBox="0 0 24 24"><path class="s" d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <div class="textbar" id="textbar" role="toolbar" aria-label="Text options" hidden>
        <select id="tx-font" aria-label="Font"></select>
        <input type="number" id="tx-size" min="8" max="200" value="32" aria-label="Text size">
        <button id="tx-bold" aria-pressed="false" title="Bold"><b>B</b></button>
        <button id="tx-done" title="Place the text (Ctrl+Enter or Esc)">Done</button>
        <button id="tx-cancel" title="Discard the text">Cancel</button>
      </div>

      <div class="recent" id="recent">
        <div class="recent-main">
          <span class="label">Recent:</span>
          <div class="recent-list" id="recent-list"></div>
          <span class="hint" id="recent-hint">none yet</span>
        </div>
      </div>
    </div>

    <div class="sizebar" id="sizebar">
      <div class="track" id="track">
        <div class="thumb" id="thumb" tabindex="0" role="slider" aria-orientation="vertical"
             aria-label="Brush size" aria-valuemin="1" aria-valuemax="60" aria-valuenow="6">
          <span class="ball" id="ball"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="msgbox" id="msgbox">
    <textarea id="message" maxlength="280" aria-label="Message"
      placeholder="Write messages here! Ask me anything or say something with your drawing!"></textarea>
    <span class="count"><span id="count">0</span>/280</span>
  </div>

  <div class="hp" aria-hidden="true">
    <label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label>
  </div>

  <div id="turnstile-slot"></div>

  <div class="send-row">
    <button id="send">Send anonymously</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <div class="flyout" id="flyout" role="group" aria-label="Tool variants" hidden></div>

  <div class="lmenu" id="lmenu" role="dialog" aria-label="Layer settings" hidden>
    <div class="lm-title" id="lm-title"></div>
    <label class="lm-row">Opacity
      <input type="range" id="lm-op" min="0" max="100" step="1">
      <span id="lm-opv"></span>
    </label>
    <label class="lm-row" id="lm-blend-row">Mode
      <select id="lm-blend">
        <option value="normal">Normal</option>
        <option value="multiply">Multiply</option>
        <option value="screen">Screen</option>
        <option value="add">Add (glow)</option>
        <option value="overlay">Overlay</option>
        <option value="softlight">Soft light</option>
        <option value="darken">Darken</option>
        <option value="lighten">Lighten</option>
        <option value="dodge">Color dodge</option>
      </select>
    </label>
    <label class="lm-check" id="lm-clip-row"><input type="checkbox" id="lm-clip"> Clip to layer below</label>
    <div class="lm-btns">
      <button id="lm-sel" class="wide">Add to selection</button>
      <button id="lm-up">&#9650; Up</button>
      <button id="lm-down">&#9660; Down</button>
      <button id="lm-del" class="wide">Delete layer</button>
    </div>
  </div>

  <div class="picker" id="picker" role="dialog" aria-label="Color picker" hidden>
    <div class="sv" id="p-sv" tabindex="0" aria-label="Saturation and brightness">
      <div class="knob" id="p-sv-knob"></div>
    </div>
    <div class="hue" id="p-hue" tabindex="0" aria-label="Hue">
      <div class="knob" id="p-hue-knob"></div>
    </div>
    <div class="prow">
      <div class="prev" id="p-prev"></div>
      <input type="text" id="p-hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color">
    </div>
    <button class="pdone" id="p-done">Done</button>
  </div>
</div>

<script>
const CONFIG = {
  ENDPOINT: "https://anonsystem.dustycat2006.workers.dev",
  TURNSTILE_SITEKEY: "0x4AAAAAAF5TO2XC6Tkzn2_m",
  COOLDOWN_SECONDS: 10,
  PALETTE: ["#3a56d4", "#2fb67c", "#e0457b", "#f59e0b", "#22223b", "#ffffff"],
  DEFAULT_COLOR: "#22223b",
  MAX_LAYERS: 5,
  SOUNDS: {
    VOLUME: { success: 0.8, error: 0.8, typing: 0.15 },
    FILES: {
      success: "sounds/success.mp3",
      error: "sounds/error.mp3",
      typing: ["sounds/typing.mp3"]
    },
    TYPING_SPRITES: []
  }
};

const W = 800, H = 500;
const SIZE_MIN = 1, SIZE_MAX = 60, MAX_HISTORY = 12, MAX_RECENT = 10;
const $ = (id) => document.getElementById(id);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const BLEND = {
  normal: "source-over", multiply: "multiply", screen: "screen", add: "lighter",

    else c.clearRect(0, 0, W, H);
    c.restore();
  });
}

function cutSelection(s) {
  const path = pathFrom(s.pts0);
  s.items = activeLayers.map((L) => {
    const float = document.createElement("canvas");
    float.width = W; float.height = H;
    const f = float.getContext("2d");
    f.save(); f.clip(path); f.drawImage(L.canvas, 0, 0); f.restore();

    L.ctx.save();
    L.ctx.clip(path);
    if (L.bg) { L.ctx.fillStyle = "#fff"; L.ctx.fillRect(0, 0, W, H); }
    else L.ctx.clearRect(0, 0, W, H);
    L.ctx.restore();

    const base = document.createElement("canvas");
    base.width = W; base.height = H;
    base.getContext("2d").drawImage(L.canvas, 0, 0);
    return { L, float, base };
  });
}

function continueMove(p) {
  const s = stroke;
  const dx = p.x - s.start.x, dy = p.y - s.start.y;
  if (!s.moved) {
    if (Math.hypot(dx, dy) < 3) return;
    s.moved = true;
    reveal();
    pushUndo(activeLayers);
    cutSelection(s);
  }
  s.items.forEach(({ L, base, float }) => {
    const c = L.ctx;
    c.clearRect(0, 0, W, H);
    c.drawImage(base, 0, 0);
    c.drawImage(float, dx, dy);
  });
  selection.points = s.pts0.map((q) => ({ x: q.x + dx, y: q.y + dy }));
  redrawOverlay();
}

function commitSelection(pts) {
  if (pts.length < 3 || polyArea(pts) < 40) {
    setSelection(null);
    return;
  }
  setSelection({ points: pts });
}
function finishLasso() {
  const s = stroke;
  stroke = null;
  if (s.shape === "free" && s.points.length < 4) { setSelection(null); return; }
  commitSelection(s.points);
}
function rectPts(a, b) {
  return [{ x: a.x, y: a.y }, { x: b.x, y: a.y }, { x: b.x, y: b.y }, { x: a.x, y: b.y }];
}

function finishPoly() {
  const pts = polyDraft.points;
  polyDraft = null;
  redrawOverlay();
  commitSelection(pts);
  updatePopup();
}
function cancelPoly() {
  polyDraft = null;
  redrawOverlay();
  updatePopup();
}
function polyClick(p) {
  if (!polyDraft) {
    setSelection(null);
    polyDraft = { points: [p], cursor: p, t: performance.now() };
    redrawOverlay();
    return;
  }
  const d = polyDraft, ds = dispScale();
  const first = d.points[0], last = d.points[d.points.length - 1];
  const now = performance.now();
  if (d.points.length >= 3 && Math.hypot(p.x - first.x, p.y - first.y) <= 10 * ds) { finishPoly(); return; }
  if (now - d.t < 350 && Math.hypot(p.x - last.x, p.y - last.y) <= 6 * ds) {
    if (d.points.length >= 3) finishPoly();
    return;
  }
  d.points.push(p);
  d.t = now;
  d.cursor = p;
  redrawOverlay();
}
function startSelection(p) {
  if (tool === "poly") { polyClick(p); return; }
  setSelection(null);
  stroke = { kind: "lasso", shape: tool === "rect" ? "rect" : "free", start: p, points: tool === "rect" ? rectPts(p, p) : [p] };
  redrawOverlay();
}

const FONTS = [
  ["Nunito", "'Nunito', ui-rounded, sans-serif"],
  ["Serif", "Georgia, 'Times New Roman', serif"],
  ["Mono", "'Courier New', monospace"],
  ["Marker", "'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', cursive"],
  ["Impact", "Impact, 'Arial Black', sans-serif"]
];
const textState = { font: 0, size: 32, bold: false };
const txEl = $("textedit");
FONTS.forEach((f, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = f[0];
  $("tx-font").appendChild(o);
});
function applyTextStyle() {
  if (!textEdit) return;
  const r = overlay.getBoundingClientRect(), k = r.width / W;
  txEl.style.left = textEdit.x * k + "px";
  txEl.style.top = textEdit.y * k + "px";
  txEl.style.font = (textState.bold ? 700 : 400) + " " + textState.size * k + "px/1.2 " + FONTS[textState.font][1];
  txEl.style.color = color;
}
function startText(p) {
  if (textEdit) commitText();
  textEdit = { x: p.x, y: p.y, layer: topActive() };
  txEl.textContent = "";
  txEl.hidden = false;
  $("textbar").hidden = false;
  applyTextStyle();
  setTimeout(() => txEl.focus(), 0);
}
function endTextUI() {
  textEdit = null;
  txEl.hidden = true;
  txEl.textContent = "";
  $("textbar").hidden = true;
}
function commitText() {
  if (!textEdit) return;
  const t = textEdit;
  const txt = txEl.innerText.replace(/ /g, " ").replace(/\n+$/, "");
  endTextUI();
  if (!txt.trim()) return;
  const L = layers.includes(t.layer) ? t.layer : topActive();
  if (!L.visible) setVisible(L, true);
  pushUndo([L]);
  const c = L.ctx, size = textState.size;
  c.save();
  if (selection) c.clip(pathFrom(selection.points));
  c.globalCompositeOperation = "source-over";
  c.globalAlpha = 1;
  c.fillStyle = color;
  c.font = (textState.bold ? 700 : 400) + " " + size + "px " + FONTS[textState.font][1];
  c.textBaseline = "middle";
  c.textAlign = "left";
  txt.split("\n").forEach((ln, i) => c.fillText(ln, t.x, t.y + (i + 0.5) * size * 1.2));
  c.restore();
  hasInk = true;
  noteColor(color);
}
$("tx-font").addEventListener("change", () => {
  textState.font = +$("tx-font").value;
  applyTextStyle();
  txEl.focus();
});
$("tx-size").addEventListener("input", () => {
  const v = Math.max(8, Math.min(200, +$("tx-size").value || 32));
  textState.size = v;
  applyTextStyle();
});
$("tx-bold").addEventListener("click", () => {
  textState.bold = !textState.bold;
  $("tx-bold").setAttribute("aria-pressed", textState.bold);
  applyTextStyle();
  txEl.focus();
});
$("tx-done").addEventListener("click", commitText);
$("tx-cancel").addEventListener("click", endTextUI);
txEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitText(); }
});

overlay.addEventListener("pointerdown", (e) => {
  if (!$("confirm").hidden) return;
  if (e.button === 2) {
    e.preventDefault();
    if (!stroke) pickColor(pos(e));
    return;
  }
  if (e.button !== undefined && e.button > 0) return;
  e.preventDefault();
  const ae = document.activeElement;
  if (ae && ae !== document.body && ae.blur) ae.blur();
  if (textEdit) { commitText(); return; }
  overlay.setPointerCapture(e.pointerId);
  const p = pos(e);

  if (tool === "pencil" || tool === "eraser") {
    startDraw(p);
  } else if (tool === "bucket") {
    bucketFill(p, false);
  } else if (tool === "bucketIgnore") {
    bucketFill(p, true);
  } else if (tool === "text") {
    startText(p);
  } else if (tool === "picker") {
    if (pickColor(p)) setTool(prevTool === "eraser" ? variant.pencil : prevTool);
  } else if (isSel(tool)) {
    if (tool === "poly" && polyDraft) {
      polyClick(p);
    } else {
      const inside = selection && sctx.isPointInPath(pathFrom(selection.points), p.x, p.y);
      if (transform) {
        const h = hitHandle(p);
        if (h || inside) {
          beginTf();
          stroke = {
            kind: "tf", mode: h ? h.mode : "move", hx: h ? h.hx : 0, hy: h ? h.hy : 0,
            start: p, C: { x: transform.C.x, y: transform.C.y }, sx: transform.sx, sy: transform.sy
          };
        } else {
          exitTransform();
          setSelection(null);
          startSelection(p);
        }
      } else if (inside) {
        stroke = { kind: "move", start: p, moved: false, pts0: selection.points.map((q) => ({ x: q.x, y: q.y })), items: null };
      } else {
        startSelection(p);
      }
    }
  }
  updatePopup();
});

overlay.addEventListener("pointermove", (e) => {
  if (!stroke) {
    if (polyDraft && tool === "poly") {
      polyDraft.cursor = pos(e);
      redrawOverlay();
    }
    return;
  }
  if (stroke.kind === "draw") continueDraw(e);
  else if (stroke.kind === "move") continueMove(pos(e));
  else if (stroke.kind === "tf") continueTf(e);
  else if (stroke.kind === "lasso") {
    const p = pos(e);
    if (stroke.shape === "rect") {
      stroke.points = rectPts(stroke.start, p);
      redrawOverlay();
    } else {
      const last = stroke.points[stroke.points.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) > 1.5) {
        stroke.points.push(p);
        redrawOverlay();
      }
    }
  }
});

function endGesture() {
  if (!stroke) return;
  if (stroke.kind === "draw") {
    const s = stroke;
    s.items.forEach(({ c }) => {
      c.beginPath();
      c.moveTo(s.mid.x, s.mid.y);
      c.lineTo(s.last.x, s.last.y);
      c.stroke();
      c.restore();
    });
    if (tool === "pencil") hasInk = true;
    stroke = null;
  } else if (stroke.kind === "move") {
    if (stroke.moved) hasInk = true;
    stroke = null;
  } else if (stroke.kind === "tf") {
    hasInk = true;
    stroke = null;
  } else if (stroke.kind === "lasso") {
    finishLasso();
  }
  updatePopup();
}
overlay.addEventListener("pointerup", endGesture);
overlay.addEventListener("pointercancel", endGesture);

function openConfirm() { $("confirm").hidden = false; $("confirm-no").focus(); }
function closeConfirm(refocus) {
  $("confirm").hidden = true;
  if (refocus) $("clear").focus();
}
$("clear").addEventListener("click", () => { if (textEdit) commitText(); openConfirm(); });
$("confirm-no").addEventListener("click", (e) => closeConfirm(e.detail === 0));
$("confirm-yes").addEventListener("click", (e) => {
  pushUndo(layers.slice());
  wipeAll();
  hasInk = false;
  setSelection(null);
  closeConfirm(e.detail === 0);
});

document.addEventListener("click", (e) => {
  if (e.detail > 0) {
    const b = e.target.closest && e.target.closest("button, input[type=range], input[type=checkbox]");
    if (b) b.blur();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!$("confirm").hidden) closeConfirm(true);
    else if (textEdit) commitText();
    else if (flySlot) closeFlyout();
    else if (menuLayer) closeLayerMenu();
    else if (pickerOpen) closePicker();
    else if (polyDraft) cancelPoly();
    else if (transform) exitTransform();
    else if (selection) setSelection(null);
    return;
  }
  const t = e.target;
  if (t && (t.isContentEditable || ["TEXTAREA", "INPUT", "SELECT"].includes(t.tagName))) return;
  if (!$("confirm").hidden) return;

  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === "y") { e.preventDefault(); redo(); }
    return;
  }
  if (e.altKey) return;

  if (k === "tab") {
    const ae = document.activeElement;
    if (SIZED.includes(tool) && (!ae || ae === document.body)) {
      e.preventDefault();
      setTool(tool === "eraser" ? variant.pencil : "eraser");
    }
    return;
  }
  if (e.repeat) return;

  switch (k) {
    case "p": setTool(variant.pencil); break;
    case "e": setTool("eraser"); break;
    case "b": setTool(variant.bucket); break;
    case "l": setTool(variant.lasso); break;
    case "i": setTool("picker"); break;
    case "enter":
      if (polyDraft) {
        e.preventDefault();
        if (polyDraft.points.length >= 3) finishPoly(); else cancelPoly();
      } else if (transform) { e.preventDefault(); exitTransform(); }
      break;
    case "f": if (selection) { e.preventDefault(); fillSelection(); } break;
    case "backspace":
    case "delete":
      if (polyDraft) {
        e.preventDefault();
        polyDraft.points.pop();
        if (!polyDraft.points.length) cancelPoly(); else redrawOverlay();
      } else if (selection) { e.preventDefault(); clearSelection(); }
      break;
  }
});

const SND = CONFIG.SOUNDS;
let actx = null;
const bufs = {};
let lastTypeAt = 0, lastSprite = -1;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function getAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function getBuf(url) {
  if (!url) return null;
  const b = bufs[url];
  if (b === undefined) {
    bufs[url] = null;
    const ctx = getAudio();
    if (!ctx) return null;
    fetch(url)
      .then((r) => { if (!r.ok) throw new Error("missing"); return r.arrayBuffer(); })
      .then((a) => ctx.decodeAudioData(a))
      .then((buf) => { bufs[url] = buf; })
      .catch(() => { bufs[url] = false; });
    return null;
  }
  return b || null;
}
function warmSounds() {
  getAudio();
  getBuf(SND.FILES.success);
  getBuf(SND.FILES.error);
  SND.FILES.typing.forEach(getBuf);
}
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, warmSounds, { once: true }));

function synthTone(freq, start, dur, type, vol) {
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function synthSound(kind, vol) {
  if (kind === "success") {
    synthTone(660, 0, 0.18, "sine", vol * 0.5);
    synthTone(880, 0.12, 0.28, "sine", vol * 0.5);
    synthTone(1320, 0.24, 0.35, "sine", vol * 0.35);
  } else if (kind === "error") {
    synthTone(220, 0, 0.18, "sawtooth", vol * 0.3);
    synthTone(165, 0.16, 0.32, "sawtooth", vol * 0.3);
  } else {
    const len = Math.floor(actx.sampleRate * 0.03);
    const nb = actx.createBuffer(1, len, actx.sampleRate);
    const d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = actx.createBufferSource();
    src.buffer = nb;
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500 + Math.random() * 3000;
    bp.Q.value = 1.2;
    const g = actx.createGain();
    g.gain.value = vol * (1.2 + Math.random() * 0.8) * 2;
    src.connect(bp).connect(g).connect(actx.destination);
    src.start();
  }
}
function playSound(kind, volMul) {
  const ctx = getAudio();
  if (!ctx) return;
  let vol = (SND.VOLUME[kind] || 0) * (volMul || 1);
  if (vol <= 0) return;
  const url = kind === "typing" ? pick(SND.FILES.typing) : SND.FILES[kind];
  const buf = getBuf(url);
  if (!buf) { synthSound(kind, vol); return; }
  let offset = 0, dur, rate = 1;
  if (kind === "typing") {
    rate = 0.92 + Math.random() * 0.16;
    vol *= 0.7 + Math.random() * 0.5;
    if (SND.TYPING_SPRITES.length) {
      let i;
      do { i = Math.floor(Math.random() * SND.TYPING_SPRITES.length); }
      while (SND.TYPING_SPRITES.length > 1 && i === lastSprite);
      lastSprite = i;
      offset = SND.TYPING_SPRITES[i][0];
      dur = SND.TYPING_SPRITES[i][1];
    }
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  const g = ctx.createGain();
  g.gain.value = vol;
  src.connect(g).connect(ctx.destination);
  if (dur) src.start(0, offset, dur); else src.start(0);
}

const msg = $("message"), msgbox = $("msgbox");
let bounce = null;
let lastInputAt = 0;
msg.addEventListener("input", (e) => {
  $("count").textContent = msg.value.length;
  const it = e.inputType || "";
  const now = performance.now();
  if ((it.startsWith("insert") || it.startsWith("delete")) && now - lastTypeAt > 28) {
    lastTypeAt = now;
    playSound("typing", it.startsWith("delete") ? 0.7 : 1);
  }
  const gap = now - lastInputAt;
  lastInputAt = now;
  if (reduceMotion || !msgbox.animate) return;
  const k = Math.min(1, Math.max(0.2, gap / 220));
  const dx = (Math.random() * 2 - 1) * 2.5 * k;
  const dy = (Math.random() * 2 - 1) * 2 * k;
  const r = (Math.random() * 2 - 1) * 0.5 * k;
  if (bounce) bounce.cancel();
  bounce = msgbox.animate(
    [
      { transform: `translate(${dx}px, ${dy}px) rotate(${r}deg) scale(${1 + 0.006 * k})` },
      { transform: "translate(0, 0) rotate(0deg) scale(1)" }
    ],
    { duration: 260, easing: "cubic-bezier(.2, 1.8, .4, 1)" }
  );
});

let turnstileToken = "";
let turnstileWidgetId = null;
if (CONFIG.TURNSTILE_SITEKEY) {
  window.onTurnstileLoad = () => {
    turnstileWidgetId = turnstile.render("#turnstile-slot", {
      sitekey: CONFIG.TURNSTILE_SITEKEY,
      callback: (t) => { turnstileToken = t; },
      "expired-callback": () => { turnstileToken = ""; },
      "error-callback": () => { turnstileToken = ""; }
    });
  };
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit";
  s.async = true;
  document.head.appendChild(s);
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = kind || "";
}
function fail(text) {
  setStatus(text, "err");
  playSound("error");
}
function cooldownLeft() {
  try {
    const t = +localStorage.getItem("anon-draw-last") || 0;
    return Math.max(0, Math.ceil(CONFIG.COOLDOWN_SECONDS - (Date.now() - t) / 1000));
  } catch (_) { return 0; }
}
function markSent() {
  try { localStorage.setItem("anon-draw-last", String(Date.now())); } catch (_) {}
}

$("send").addEventListener("click", async () => {
  if (textEdit) commitText();
  const message = msg.value.trim();
  const ink = hasInk && mergedHasContent();
  if (!ink && !message) { fail("Draw something or write a message first."); return; }
  const wait = cooldownLeft();
  if (wait > 0) { fail("Please wait " + wait + "s before sending again."); return; }
  if (CONFIG.TURNSTILE_SITEKEY && !turnstileToken) { fail("Finish the human check first."); return; }

  const btn = $("send");
  btn.disabled = true;
  setStatus("Sending…");

  try {
    const form = new FormData();
    form.append("message", message);
    form.append("website", $("website").value);
    if (turnstileToken) form.append("cf-turnstile-response", turnstileToken);
    if (ink) {
      drawMerged();
      mctx.globalCompositeOperation = "destination-over";
      mctx.fillStyle = "#fff";
      mctx.fillRect(0, 0, W, H);
      mctx.globalCompositeOperation = "source-over";
      const blob = await new Promise((res) => merged.toBlob(res, "image/png"));
      form.append("image", blob, "drawing.png");
    }

    const res = await fetch(CONFIG.ENDPOINT, { method: "POST", body: form });
    let body = {};
    try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(body.error || "Something went wrong (" + res.status + ").");

    markSent();
    setStatus("Sent! Thank you.", "ok");
    playSound("success");
    wipeAll();
    hasInk = false;
    undoStack.length = 0; redoStack.length = 0; refreshHistory();
    setSelection(null);
    msg.value = "";
    $("count").textContent = "0";
  } catch (err) {
    fail(err.message || "Could not send. Try again.");
  } finally {
    btn.disabled = false;
    if (window.turnstile && turnstileWidgetId !== null) {
      turnstile.reset(turnstileWidgetId);
      turnstileToken = "";
    }
  }
});

setColor(color);
setTool("pencil");
renderLayerList();
refreshHistory();
frame();
window.addEventListener("resize", () => { renderSlider(); updatePopup(); });

overlay.addEventListener("contextmenu", (e) => e.preventDefault());

$("s-fill").addEventListener("click", fillSelection);
$("s-del").addEventListener("click", clearSelection);
$("s-tf").addEventListener("click", () => {
  if (!selection) return;
  if (transform) exitTransform();
  else { if (!isSel(tool)) setTool(selTool()); enterTransform(); }
});
$("s-x").addEventListener("click", () => setSelection(null));
</script>
