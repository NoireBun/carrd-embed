<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw me something</title>
<style>
  :root {
    --ink: #22223b;
    --muted: #6b6d86;
    --panel: #f1f0f8;
    --line: #d9d7ea;
    --accent: #e0457b;
    --accent-ink: #ffffff;
    --paper: #ffffff;
    --focus: #3a56d4;
    --ok: #1f8a5b;
    --err: #c2312d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ecebf7;
      --muted: #a2a4be;
      --panel: #2a2a42;
      --line: #43435f;
      --accent: #ff6a9b;
      --accent-ink: #1d1d30;
      --focus: #8ea2ff;
      --ok: #5fd39b;
      --err: #ff8c88;
    }
    body { background: #1d1d30; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 12px;
    line-height: 1.4;
  }
  .app { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    background: var(--panel); border-radius: 14px; padding: 10px 12px;
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0;
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  input[type="color"] {
    width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  input[type="range"] { width: 110px; accent-color: var(--accent); }
  .size-preview {
    width: 34px; height: 34px; display: grid; place-items: center;
  }
  .size-preview span { display: block; border-radius: 50%; background: var(--ink); }

  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button[aria-pressed="true"].tool { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .swatch:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  .spacer { flex: 1; }

  .canvas-wrap {
    border-radius: 6px 18px 6px 18px; overflow: hidden;
    border: 2px solid var(--ink); background: #fff; line-height: 0;
  }
  canvas {
    width: 100%; height: auto; aspect-ratio: 8 / 5;
    touch-action: none; cursor: crosshair; display: block;
  }

  label.msg { display: grid; gap: 4px; font-weight: 600; }
  textarea {
    font: inherit; font-weight: 400; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    resize: vertical; min-height: 72px; width: 100%;
  }
  .count { font-weight: 400; font-size: 0.85rem; color: var(--muted); text-align: right; }

  .send-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #send {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    font-weight: 700; padding: 10px 22px; border-radius: 12px;
  }
  #send:disabled { opacity: 0.55; cursor: not-allowed; }
  #status { min-height: 1.4em; font-size: 0.95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  /* Honeypot: hidden from people, visible to bots */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  #turnstile-slot { min-height: 0; }
</style>
</head>
<body>
<div class="app">

  <div class="toolbar" role="toolbar" aria-label="Drawing tools">
    <div class="group">
      <button class="tool" id="tool-brush" aria-pressed="true">Brush</button>
      <button class="tool" id="tool-eraser" aria-pressed="false">Eraser</button>
    </div>

    <div class="group">
      <div class="swatches" id="swatches" aria-label="Colors"></div>
      <input type="color" id="color" value="#22223b" aria-label="Custom color">
    </div>

    <div class="group">
      <input type="range" id="size" min="1" max="48" value="6" aria-label="Brush size">
      <div class="size-preview" aria-hidden="true"><span id="size-dot"></span></div>
    </div>

    <span class="spacer"></span>

    <div class="group">
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="board" width="800" height="500" aria-label="Drawing canvas"></canvas>
  </div>

  <label class="msg" for="message">
    Message (optional)
    <textarea id="message" maxlength="280" placeholder="Say something. You stay anonymous."></textarea>
    <span class="count"><span id="count">0</span>/280</span>
  </label>

  <!-- Honeypot -->
  <div class="hp" aria-hidden="true">
    <label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label>
  </div>

  <div id="turnstile-slot"></div>

  <div class="send-row">
    <button id="send">Send anonymously</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</div>

<script>
/* ============ SETTINGS: edit these ============ */
const CONFIG = {
  // Your Cloudflare Worker URL (see README)
  ENDPOINT: "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev",
  // Cloudflare Turnstile site key (public). Leave "" to turn the captcha off.
  TURNSTILE_SITEKEY: "",
  // Seconds a visitor must wait between sends (browser-side politeness; the Worker enforces the real limit)
  COOLDOWN_SECONDS: 30,
  PALETTE: ["#22223b", "#e0457b", "#f59e0b", "#2fb67c", "#3a56d4", "#8b5cf6", "#8a5a44", "#ffffff"]
};
/* ============================================== */

const W = 800, H = 500;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const $ = (id) => document.getElementById(id);

let tool = "brush";
let color = CONFIG.PALETTE[0];
let size = 6;
let hasInk = false;
let drawing = false;
let last = null, lastMid = null;
const undoStack = [];

function paintBackground() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
}
paintBackground();
ctx.lineCap = "round";
ctx.lineJoin = "round";

/* ---------- Tools UI ---------- */
function updateSizeDot() {
  const d = Math.max(2, Math.min(size, 32));
  const dot = $("size-dot");
  dot.style.width = dot.style.height = d + "px";
  dot.style.background = tool === "eraser" ? "var(--line)" : color;
}

function setTool(t) {
  tool = t;
  $("tool-brush").setAttribute("aria-pressed", t === "brush");
  $("tool-eraser").setAttribute("aria-pressed", t === "eraser");
  updateSizeDot();
}

function setColor(c) {
  color = c;
  $("color").value = c;
  document.querySelectorAll(".swatch").forEach((s) =>
    s.setAttribute("aria-pressed", s.dataset.color.toLowerCase() === c.toLowerCase())
  );
  setTool("brush");
}

CONFIG.PALETTE.forEach((c) => {
  const b = document.createElement("button");
  b.className = "swatch";
  b.style.background = c;
  b.dataset.color = c;
  b.setAttribute("aria-label", "Color " + c);
  b.setAttribute("aria-pressed", c === color);
  b.addEventListener("click", () => setColor(c));
  $("swatches").appendChild(b);
});

$("tool-brush").addEventListener("click", () => setTool("brush"));
$("tool-eraser").addEventListener("click", () => setTool("eraser"));
$("color").addEventListener("input", (e) => setColor(e.target.value));
$("size").addEventListener("input", (e) => { size = +e.target.value; updateSizeDot(); });
updateSizeDot();

/* ---------- Undo / clear ---------- */
function snapshot() {
  undoStack.push({ data: ctx.getImageData(0, 0, W, H), hasInk });
  if (undoStack.length > 25) undoStack.shift();
}
$("undo").addEventListener("click", () => {
  const s = undoStack.pop();
  if (!s) return;
  ctx.putImageData(s.data, 0, 0);
  hasInk = s.hasInk;
});
$("clear").addEventListener("click", () => {
  snapshot();
  paintBackground();
  hasInk = false;
});

/* ---------- Drawing ---------- */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
}
function applyStroke() {
  ctx.strokeStyle = tool === "eraser" ? "#ffffff" : color;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = size;
}

canvas.addEventListener("pointerdown", (e) => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  snapshot();
  drawing = true;
  last = lastMid = pos(e);
  applyStroke();
  ctx.beginPath();
  ctx.arc(last.x, last.y, size / 2, 0, Math.PI * 2);
  ctx.fill();
  if (tool === "brush") hasInk = true;
});

canvas.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  applyStroke();
  for (const ev of (events.length ? events : [e])) {
    const p = pos(ev);
    const m = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.beginPath();
    ctx.moveTo(lastMid.x, lastMid.y);
    ctx.quadraticCurveTo(last.x, last.y, m.x, m.y);
    ctx.stroke();
    last = p;
    lastMid = m;
  }
});

function endStroke() { drawing = false; }
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);
canvas.addEventListener("pointerleave", endStroke);

/* ---------- Message counter ---------- */
$("message").addEventListener("input", (e) => { $("count").textContent = e.target.value.length; });

/* ---------- Turnstile (optional) ---------- */
let turnstileToken = "";
let turnstileWidgetId = null;
if (CONFIG.TURNSTILE_SITEKEY) {
  window.onTurnstileLoad = () => {
    turnstileWidgetId = turnstile.render("#turnstile-slot", {
      sitekey: CONFIG.TURNSTILE_SITEKEY,
      callback: (t) => { turnstileToken = t; },
      "expired-callback": () => { turnstileToken = ""; },
      "error-callback": () => { turnstileToken = ""; }
    });
  };
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit";
  s.async = true;
  document.head.appendChild(s);
}

/* ---------- Sending ---------- */
function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = kind || "";
}

function cooldownLeft() {
  try {
    const t = +localStorage.getItem("anon-draw-last") || 0;
    return Math.max(0, Math.ceil(CONFIG.COOLDOWN_SECONDS - (Date.now() - t) / 1000));
  } catch (_) { return 0; }
}
function markSent() {
  try { localStorage.setItem("anon-draw-last", String(Date.now())); } catch (_) {}
}

function canvasToBlob() {
  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

$("send").addEventListener("click", async () => {
  const message = $("message").value.trim();

  if (!hasInk && !message) {
    setStatus("Draw something or write a message first.", "err");
    return;
  }
  const wait = cooldownLeft();
  if (wait > 0) {
    setStatus("Please wait " + wait + "s before sending again.", "err");
    return;
  }
  if (CONFIG.TURNSTILE_SITEKEY && !turnstileToken) {
    setStatus("Finish the human check first.", "err");
    return;
  }
  if (CONFIG.ENDPOINT.includes("YOUR-WORKER")) {
    setStatus("Set your Worker URL in CONFIG.ENDPOINT first.", "err");
    return;
  }

  const btn = $("send");
  btn.disabled = true;
  setStatus("Sending…");

  try {
    const form = new FormData();
    form.append("message", message);
    form.append("website", $("website").value); // honeypot
    if (turnstileToken) form.append("cf-turnstile-response", turnstileToken);
    if (hasInk) {
      const blob = await canvasToBlob();
      form.append("image", blob, "drawing.png");
    }

    const res = await fetch(CONFIG.ENDPOINT, { method: "POST", body: form });
    let body = {};
    try { body = await res.json(); } catch (_) {}

    if (!res.ok) throw new Error(body.error || "Something went wrong (" + res.status + ").");

    markSent();
    setStatus("Sent! Thank you.", "ok");
    paintBackground();
    hasInk = false;
    undoStack.length = 0;
    $("message").value = "";
    $("count").textContent = "0";
  } catch (err) {
    setStatus(err.message || "Could not send. Try again.", "err");
  } finally {
    btn.disabled = false;
    if (window.turnstile && turnstileWidgetId !== null) {
      turnstile.reset(turnstileWidgetId);
      turnstileToken = "";
    }
  }
});
</script>
</body>
</html>
